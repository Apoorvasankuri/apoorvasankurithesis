<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zolotel — AI Healthcare Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ============================ TOKENS ============================ */
:root{
  --abyss:#060B16; --navy:#0B1B33; --navy-700:#102845; --ink:#0A1626;
  --cyan:#38E1D6; --electric:#4D8DFF; --teal:#36C6A8;
  --mist:#E6EEF7; --silver:#9FB3C8; --slate:#6B7C93;
  --glass:rgba(255,255,255,0.045); --glass-2:rgba(255,255,255,0.07);
  --line:rgba(255,255,255,0.10); --line-2:rgba(255,255,255,0.16);
  --crit:#FF5C7A; --high:#FFB454; --med:#4D8DFF; --low:#6B7C93;
  --shadow:0 18px 50px -20px rgba(0,0,0,0.7);
  --r:16px; --r-sm:10px;
  --disp:'Manrope',sans-serif; --body:'Inter',sans-serif; --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--body); color:var(--mist); background:var(--abyss);
  min-height:100vh; -webkit-font-smoothing:antialiased; line-height:1.5;
  position:relative; overflow-x:hidden;
}
/* deep navy gradient + radial glow + faint medical grid */
body::before{
  content:""; position:fixed; inset:0; z-index:-2;
  background:
    radial-gradient(1100px 620px at 78% -8%, rgba(56,225,214,0.10), transparent 60%),
    radial-gradient(900px 600px at 8% 4%, rgba(77,141,255,0.10), transparent 55%),
    linear-gradient(160deg, #07101F 0%, #0A1A30 48%, #060B16 100%);
}
body::after{
  content:""; position:fixed; inset:0; z-index:-1; opacity:.5;
  background-image:
    linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(circle at 50% 0%, #000 0%, transparent 75%);
}
::selection{background:rgba(56,225,214,0.25)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.10);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.18)}

/* glass mixin via utility */
.glass{
  background:var(--glass); backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,0.06);
}

/* ============================ SHELL ============================ */
.wrap{max-width:1320px;margin:0 auto;padding:0 24px}

/* topbar */
.topbar{position:sticky;top:0;z-index:40;
  backdrop-filter:blur(20px) saturate(140%); -webkit-backdrop-filter:blur(20px) saturate(140%);
  background:linear-gradient(180deg, rgba(8,16,30,0.86), rgba(8,16,30,0.55));
  border-bottom:1px solid var(--line);
}
.topbar__in{display:flex;align-items:center;gap:24px;padding:16px 24px;max-width:1320px;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px;flex-shrink:0}
.brand__mark{position:relative;width:42px;height:42px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(150deg, rgba(56,225,214,0.22), rgba(77,141,255,0.16));
  border:1px solid rgba(56,225,214,0.32);display:grid;place-items:center}
.brand__mark svg{width:24px;height:24px}
.brand__name{font-family:var(--disp);font-weight:800;font-size:21px;letter-spacing:.5px;line-height:1}
.brand__name b{color:var(--cyan);font-weight:800}
.brand__sub{font-family:var(--mono);font-size:10.5px;letter-spacing:2.5px;color:var(--silver);
  text-transform:uppercase;margin-top:4px}
.ecg{flex:1;height:42px;min-width:60px;opacity:.7}
.ecg path{fill:none;stroke:var(--cyan);stroke-width:1.6;
  filter:drop-shadow(0 0 5px rgba(56,225,214,0.6))}
.ecg .lead{stroke:rgba(56,225,214,0.28)}

.search{position:relative;flex-shrink:0;width:300px;max-width:34vw}
.search input{width:100%;font-family:var(--body);font-size:13.5px;color:var(--mist);
  background:var(--glass);border:1px solid var(--line);border-radius:11px;
  padding:11px 14px 11px 38px;outline:none;transition:border-color .2s,background .2s}
.search input::placeholder{color:var(--slate)}
.search input:focus{border-color:rgba(56,225,214,0.5);background:var(--glass-2)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--slate)}

/* stats strip */
.stats{display:flex;gap:0;border-top:1px solid var(--line);max-width:1320px;margin:0 auto}
.stat{flex:1;padding:12px 24px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.stat:last-child{border-right:none}
.stat__n{font-family:var(--mono);font-weight:600;font-size:19px;color:var(--mist);letter-spacing:.5px}
.stat__n.accent{color:var(--cyan)}
.stat__l{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--slate);font-weight:500}

/* tabs */
.tabs{position:sticky;top:74px;z-index:30;display:flex;gap:4px;overflow-x:auto;
  padding:12px 24px;max-width:1320px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;font-size:13px;font-weight:600;color:var(--silver);
  padding:9px 16px;border-radius:10px;border:1px solid transparent;transition:.18s;letter-spacing:.2px}
.tab:hover{color:var(--mist);background:var(--glass)}
.tab[aria-selected="true"]{color:var(--abyss);background:linear-gradient(135deg,var(--cyan),#5fe9df);
  box-shadow:0 6px 18px -6px rgba(56,225,214,0.55);font-weight:700}

/* filters */
.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 24px 0;max-width:1320px;margin:0 auto}
.filters__lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--slate);margin-right:2px}
.select{position:relative}
.select select{appearance:none;font-family:var(--body);font-size:12.5px;color:var(--mist);
  background:var(--glass);border:1px solid var(--line);border-radius:9px;padding:8px 30px 8px 13px;
  outline:none;cursor:pointer;transition:border-color .2s}
.select select:focus{border-color:rgba(56,225,214,0.5)}
.select::after{content:"";position:absolute;right:12px;top:50%;width:7px;height:7px;
  border-right:1.5px solid var(--silver);border-bottom:1.5px solid var(--silver);
  transform:translateY(-65%) rotate(45deg);pointer-events:none}
.select option{background:#0C1A30;color:var(--mist)}

/* ============================ CONTENT ============================ */
main{padding:22px 0 80px}
.titlebar{display:flex;align-items:baseline;gap:14px;padding:8px 24px 18px;max-width:1320px;margin:0 auto}
.titlebar h1{font-family:var(--disp);font-weight:700;font-size:24px;letter-spacing:-.3px}
.titlebar p{font-size:13px;color:var(--silver)}

/* vertical section */
.vsection{margin:0 24px 30px;max-width:1320px}
.wrap-center .vsection{margin-left:auto;margin-right:auto}
.vhead{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.vhead__icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;
  background:var(--glass);border:1px solid var(--line)}
.vhead__icon svg{width:19px;height:19px;color:var(--cyan)}
.vhead__name{font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.2px}
.vhead__count{font-family:var(--mono);font-size:11px;color:var(--slate);letter-spacing:1px;
  margin-left:auto;text-transform:uppercase}

/* card grid */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}

/* executive card */
.card{position:relative;display:flex;flex-direction:column;padding:16px 16px 14px;cursor:pointer;
  transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease}
.card:hover{transform:translateY(-3px);border-color:var(--line-2);
  box-shadow:0 24px 50px -22px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.08)}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;
  background:var(--accent,var(--electric))}
.card__top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.impact{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;
  padding:4px 9px;border-radius:6px;color:var(--abyss)}
.impact[data-i="critical"]{background:var(--crit)}
.impact[data-i="high"]{background:var(--high)}
.impact[data-i="medium"]{background:var(--med)}
.impact[data-i="low"]{background:var(--low);color:var(--mist)}
.impact[data-i=""]{background:var(--slate);color:var(--mist)}
.csize{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--silver);
  display:flex;align-items:center;gap:5px}
.csize svg{width:13px;height:13px;opacity:.8}
.card__title{font-family:var(--disp);font-weight:700;font-size:15.5px;line-height:1.32;color:var(--mist);
  letter-spacing:-.1px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card__why{font-size:12.7px;color:var(--silver);line-height:1.5;margin-top:8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card__rule{height:1px;background:var(--line);margin:13px 0 11px}
.card__sub{font-size:11.5px;color:var(--cyan);font-weight:600;letter-spacing:.2px;margin-bottom:9px}
.card__sub .geo{color:var(--slate);font-weight:400}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.badge{font-family:var(--mono);font-size:10px;letter-spacing:.4px;padding:3px 8px;border-radius:6px;
  border:1px solid var(--line);color:var(--silver);background:rgba(255,255,255,0.03);white-space:nowrap}
.badge b{color:var(--mist);font-weight:600}
.badge.q-official{border-color:rgba(56,225,214,0.4);color:var(--cyan)}
.badge.q-peer{border-color:rgba(54,198,168,0.4);color:var(--teal)}
.badge.q-pr{border-color:rgba(255,180,84,0.35);color:var(--high)}
.card__foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto}
.src{font-size:11.5px;color:var(--silver);display:flex;align-items:center;gap:6px;min-width:0}
.src a{color:var(--mist);font-weight:600;display:inline-flex;align-items:center;gap:4px;
  border-bottom:1px solid transparent;transition:.15s;white-space:nowrap}
.src a:hover{color:var(--cyan);border-color:var(--cyan)}
.src svg{width:12px;height:12px}
.rank{font-family:var(--mono);font-size:11px;color:var(--slate);letter-spacing:.5px;flex-shrink:0}
.rank b{color:var(--electric);font-weight:600}

/* ============================ ALL INTELLIGENCE (table) ============================ */
.tablewrap{margin:0 24px;max-width:1320px;overflow:hidden;padding:0}
.itable{width:100%;border-collapse:collapse;font-size:13px}
.itable thead th{font-family:var(--mono);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--slate);text-align:left;padding:14px 14px;border-bottom:1px solid var(--line-2);font-weight:600}
.itable tbody td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.itable tbody tr{transition:background .15s}
.itable tbody tr:hover{background:var(--glass)}
.itable .t-title{font-weight:600;color:var(--mist);max-width:460px;line-height:1.4}
.itable .t-title a:hover{color:var(--cyan)}
.itable .t-meta{font-size:11.5px;color:var(--silver);margin-top:4px}
.itable .t-dot{color:var(--slate);margin:0 6px}
.idot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:middle}
.t-rank{font-family:var(--mono);color:var(--electric);font-weight:600}
.t-date{font-family:var(--mono);font-size:11.5px;color:var(--slate);white-space:nowrap}
.loadmore{display:block;margin:22px auto 0;font-family:var(--mono);font-size:12px;letter-spacing:1px;
  text-transform:uppercase;color:var(--cyan);padding:11px 22px;border:1px solid rgba(56,225,214,0.35);
  border-radius:10px;background:var(--glass);transition:.18s}
.loadmore:hover{background:var(--glass-2);border-color:var(--cyan)}

/* ============================ ASK AI ============================ */
.ask{margin:0 24px;max-width:900px;display:flex;flex-direction:column;height:calc(100vh - 290px);min-height:440px;overflow:hidden}
.ask__log{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:18px}
.ask__hello{text-align:center;margin:auto;max-width:440px;color:var(--silver)}
.ask__hello h2{font-family:var(--disp);font-weight:700;font-size:19px;color:var(--mist);margin-bottom:8px}
.ask__hello p{font-size:13px;line-height:1.6}
.ask__chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.chip{font-size:12px;color:var(--cyan);border:1px solid rgba(56,225,214,0.3);background:var(--glass);
  padding:8px 13px;border-radius:20px;transition:.16s}
.chip:hover{background:var(--glass-2);border-color:var(--cyan)}
.msg{display:flex;gap:11px;max-width:88%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg__av{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:grid;place-items:center;
  font-family:var(--mono);font-size:11px;font-weight:600}
.msg.ai .msg__av{background:linear-gradient(140deg,rgba(56,225,214,0.2),rgba(77,141,255,0.16));
  border:1px solid rgba(56,225,214,0.3);color:var(--cyan)}
.msg.user .msg__av{background:var(--glass-2);border:1px solid var(--line);color:var(--silver)}
.msg__body{font-size:13.5px;line-height:1.62;padding:12px 15px;border-radius:13px}
.msg.ai .msg__body{background:var(--glass);border:1px solid var(--line);border-top-left-radius:4px}
.msg.user .msg__body{background:rgba(77,141,255,0.14);border:1px solid rgba(77,141,255,0.25);border-top-right-radius:4px}
.msg__src{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.msg__src a{font-size:11.5px;color:var(--silver);display:flex;gap:7px;align-items:center}
.msg__src a:hover{color:var(--cyan)}
.msg__src .tag{font-family:var(--mono);font-size:9px;letter-spacing:.5px;padding:1px 6px;border-radius:4px;
  border:1px solid var(--line);text-transform:uppercase;flex-shrink:0}
.msg__src .tag.db{color:var(--cyan);border-color:rgba(56,225,214,0.3)}
.msg__src .tag.web{color:var(--electric);border-color:rgba(77,141,255,0.3)}
.ask__form{display:flex;gap:10px;padding:16px;border-top:1px solid var(--line)}
.ask__form input{flex:1;font-family:var(--body);font-size:14px;color:var(--mist);background:var(--glass-2);
  border:1px solid var(--line);border-radius:12px;padding:13px 16px;outline:none}
.ask__form input:focus{border-color:rgba(56,225,214,0.5)}
.ask__send{background:linear-gradient(135deg,var(--cyan),#5fe9df);color:var(--abyss);font-weight:700;
  font-size:13.5px;padding:0 22px;border-radius:12px;transition:.16s;letter-spacing:.3px}
.ask__send:hover{filter:brightness(1.08)}
.ask__send:disabled{opacity:.5;cursor:not-allowed}

/* ============================ STATES ============================ */
.state{margin:40px 24px;text-align:center;padding:54px 24px;color:var(--silver)}
.state h3{font-family:var(--disp);font-weight:700;font-size:17px;color:var(--mist);margin-bottom:8px}
.state p{font-size:13px;line-height:1.6;max-width:420px;margin:0 auto}
.state .mono{font-family:var(--mono);font-size:12px;color:var(--cyan);margin-top:12px;
  background:var(--glass);display:inline-block;padding:7px 13px;border-radius:8px;border:1px solid var(--line)}
.skeleton{margin:0 24px;max-width:1320px}
.sk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.sk-card{height:180px;border-radius:var(--r);background:linear-gradient(100deg,var(--glass) 30%,var(--glass-2) 50%,var(--glass) 70%);
  background-size:200% 100%;animation:sheen 1.4s infinite linear;border:1px solid var(--line)}
@keyframes sheen{to{background-position:-200% 0}}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--cyan);border-radius:50%;
  animation:spin .8s linear infinite;margin:0 auto 18px}
@keyframes spin{to{transform:rotate(360deg)}}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--cyan);margin:0 2px;
  animation:bounce 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

/* ============================ MODAL ============================ */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:24px;
  background:rgba(4,9,18,0.7);backdrop-filter:blur(6px)}
.modal.open{display:flex}
.modal__box{width:100%;max-width:720px;max-height:86vh;overflow-y:auto;padding:26px}
.modal__head{display:flex;justify-content:space-between;gap:16px;margin-bottom:6px}
.modal__close{width:34px;height:34px;border-radius:9px;background:var(--glass);border:1px solid var(--line);
  display:grid;place-items:center;flex-shrink:0;transition:.16s}
.modal__close:hover{background:var(--glass-2);color:var(--cyan)}
.modal__box h2{font-family:var(--disp);font-weight:700;font-size:20px;line-height:1.3;padding-right:8px}
.modal__why{font-size:13.5px;color:var(--silver);line-height:1.6;margin:14px 0;
  padding:14px 16px;background:var(--glass);border-left:3px solid var(--cyan);border-radius:0 10px 10px 0}
.modal__why b{color:var(--mist)}
.modal__members{margin-top:20px}
.modal__members h4{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--slate);margin-bottom:12px}
.member{display:flex;gap:11px;padding:12px 0;border-top:1px solid var(--line)}
.member__q{font-family:var(--mono);font-size:9px;letter-spacing:.4px;text-transform:uppercase;padding:3px 7px;
  border-radius:5px;border:1px solid var(--line);color:var(--silver);height:fit-content;white-space:nowrap;flex-shrink:0}
.member__main{min-width:0}
.member__t{font-size:13px;font-weight:600;color:var(--mist);line-height:1.4}
.member__t a:hover{color:var(--cyan)}
.member__m{font-size:11px;color:var(--slate);margin-top:4px;font-family:var(--mono)}
.rep-tag{font-family:var(--mono);font-size:9px;letter-spacing:.5px;color:var(--cyan);
  border:1px solid rgba(56,225,214,0.35);padding:2px 6px;border-radius:4px;margin-left:6px}

/* ============================ RESPONSIVE ============================ */
@media(max-width:780px){
  .topbar__in{flex-wrap:wrap;gap:14px}
  .ecg{order:3;flex-basis:100%;height:30px}
  .search{width:100%;max-width:100%;order:2}
  .stats{flex-wrap:wrap}
  .stat{min-width:50%;border-right:none;border-top:1px solid var(--line)}
  .tabs{top:64px}
  .vgrid,.sk-grid{grid-template-columns:1fr}
  .itable thead{display:none}
  .itable tbody td{display:block;border:none;padding:4px 16px}
  .itable tbody tr{display:block;border-bottom:1px solid var(--line);padding:12px 0}
  .titlebar{flex-direction:column;gap:4px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .ecg path{stroke-dasharray:none!important;stroke-dashoffset:0!important}
}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}
</style>
</head>
<body>

<!-- ====================== TOP BAR ====================== -->
<header class="topbar">
  <div class="topbar__in">
    <div class="brand">
      <div class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 12h3l2-6 4 12 2.5-7 1.5 4 1.5-2.5H21" stroke="#38E1D6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <div class="brand__name">ZOL<b>O</b>TEL</div>
        <div class="brand__sub">AI Healthcare Intelligence</div>
      </div>
    </div>
    <svg class="ecg" viewBox="0 0 600 42" preserveAspectRatio="none" aria-hidden="true">
      <path class="lead" d="M0 21 H600"/>
      <path id="ecgline" d="M0 21 H120 l10 0 l6 -13 l7 26 l7 -13 H300 l10 0 l5 -9 l5 18 l5 -9 H600"/>
    </svg>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m21 21-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="globalSearch" type="search" placeholder="Search intelligence…" autocomplete="off" />
    </div>
  </div>
  <div class="stats" id="statsStrip">
    <div class="stat"><span class="stat__n">—</span><span class="stat__l">Events Tracked</span></div>
    <div class="stat"><span class="stat__n">—</span><span class="stat__l">New · 7 days</span></div>
    <div class="stat"><span class="stat__n accent">—</span><span class="stat__l">High Impact</span></div>
    <div class="stat"><span class="stat__n">—</span><span class="stat__l">Regulatory</span></div>
    <div class="stat"><span class="stat__n">—</span><span class="stat__l">Articles</span></div>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="filters" id="filters" hidden>
    <span class="filters__lbl">Filter</span>
    <div class="select"><select id="fVertical"><option value="">All verticals</option></select></div>
    <div class="select"><select id="fImpact">
      <option value="">All impact</option><option>Critical</option><option>High</option><option>Medium</option><option>Low</option>
    </select></div>
    <div class="select"><select id="fWindow">
      <option value="0">All time</option><option value="2">Last 48 hours</option><option value="7">Last 7 days</option>
      <option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option>
    </select></div>
  </div>
</header>

<!-- ====================== MAIN ====================== -->
<main>
  <div class="titlebar"><h1 id="viewTitle">Executive Brief</h1><p id="viewDesc"></p></div>
  <div id="content"></div>
</main>

<!-- ====================== MODAL ====================== -->
<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="modal__box glass" id="modalBox"></div>
</div>

<script>
/* ============================ CONFIG ============================ */
const API_BASE = ""; // same-origin by default; set to your API URL if hosted separately

const VERTICALS = [
  "Drug Discovery & R&D","Diagnostics & Imaging","Clinical Decision Support",
  "Ambient Documentation & Clinical Workflow","Revenue Cycle Management (RCM)",
  "Patient Engagement & Virtual Care","Hospital Operations & Supply Chain"
];

const TABS = [
  {id:"exec-brief",       label:"Executive Brief",   path:"/api/clusters/top",     kind:"grouped", desc:"Top-ranked events across every vertical."},
  {id:"regulatory-watch", label:"Regulatory Watch",  path:"/api/regulatory-watch", kind:"grouped", desc:"FDA, CMS, HHS, EMA, WHO actions and AI governance."},
  {id:"clinical-evidence",label:"Clinical Evidence", path:"/api/clinical-evidence",kind:"grouped", desc:"Trials, validation studies, and technology breakthroughs."},
  {id:"companies-deals",  label:"Companies & Deals", path:"/api/companies-deals",  kind:"grouped", desc:"M&A, partnerships, funding, and launches."},
  {id:"adoption-tracker", label:"Adoption Tracker",  path:"/api/adoption-tracker", kind:"grouped", desc:"Provider, payer, pharma, and vendor deployments."},
  {id:"risk-governance",  label:"Risk & Governance", path:"/api/risk-governance",  kind:"grouped", desc:"Safety, bias, privacy, lawsuits, and oversight."},
  {id:"all-intelligence", label:"All Intelligence",  path:"/api/articles",         kind:"table",   desc:"The full searchable intelligence database."},
  {id:"ask-ai",           label:"Ask AI",            path:"/api/chat",             kind:"chat",    desc:"Ask questions across the intelligence database."}
];

/* vertical glyphs (minimal line icons) */
const ICONS = {
  "Drug Discovery & R&D":'<svg viewBox="0 0 24 24" fill="none"><circle cx="7" cy="7" r="2.3" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="9" r="2.3" stroke="currentColor" stroke-width="1.6"/><circle cx="11" cy="17" r="2.3" stroke="currentColor" stroke-width="1.6"/><path d="M9 8l6 1M15.5 11l-3.5 4M9 9l1.5 6" stroke="currentColor" stroke-width="1.4"/></svg>',
  "Diagnostics & Imaging":'<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 13l4-3 3 2 4-4 3 3 4-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 21h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  "Clinical Decision Support":'<svg viewBox="0 0 24 24" fill="none"><path d="M12 3a6 6 0 0 0-3 11.2V17h6v-2.8A6 6 0 0 0 12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.5 20h5M12 6.5v3.5l2 1.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  "Ambient Documentation & Clinical Workflow":'<svg viewBox="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M9 8h6M9 12h6M9 16h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="17.5" cy="6.5" r="3" fill="#0A1626" stroke="currentColor" stroke-width="1.4"/></svg>',
  "Revenue Cycle Management (RCM)":'<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 9h18" stroke="currentColor" stroke-width="1.5"/><path d="M12 12.5c-1.3 0-2 .6-2 1.4 0 1.8 4 .9 4 2.6 0 .9-.9 1.5-2 1.5m0-5.5c1 0 1.7.4 1.9 1M12 11.5v.9m0 5.1v.9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
  "Patient Engagement & Virtual Care":'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.6"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M19 4.5c1.2 0 2 .9 2 2 0 1.6-2 2.7-2 2.7s-2-1.1-2-2.7c0-1.1.8-2 2-2Z" fill="#0A1626" stroke="currentColor" stroke-width="1.3"/></svg>',
  "Hospital Operations & Supply Chain":'<svg viewBox="0 0 24 24" fill="none"><path d="M4 21V8l8-4 8 4v13" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 9.5v4M10 11.5h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M9 21v-4h6v4" stroke="currentColor" stroke-width="1.5"/></svg>'
};
const ICON_DEFAULT = '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6"/></svg>';
const ACCENTS = {Critical:"var(--crit)",High:"var(--high)",Medium:"var(--med)",Low:"var(--low)"};
const LINK_SVG = '<svg viewBox="0 0 24 24" fill="none"><path d="M9 15 20 4M15 4h5v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const STACK_SVG = '<svg viewBox="0 0 24 24" fill="none"><path d="M12 3 3 8l9 5 9-5-9-5ZM3 13l9 5 9-5M3 18l9 5 9-5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';

/* ============================ STATE ============================ */
const state = {active:"exec-brief", filters:{vertical:"",impact:"",days:30}, cache:{}, chat:[], page:{}};
const $ = s => document.querySelector(s);
const el = (t,c,h) => {const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

async function api(path){
  const r = await fetch(API_BASE + path, {headers:{"Accept":"application/json"}});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}

/* ============================ INIT ============================ */
function init(){
  // tabs
  const nav = $("#tabs");
  TABS.forEach(t=>{
    const b = el("button","tab",t.label);
    b.setAttribute("role","tab"); b.id="tab-"+t.id;
    b.setAttribute("aria-selected", t.id===state.active);
    b.onclick = ()=>switchTab(t.id);
    nav.appendChild(b);
  });
  // vertical filter options
  const fv = $("#fVertical");
  VERTICALS.forEach(v=>{const o=el("option",null,esc(v)); o.value=v; fv.appendChild(o);});
  $("#fVertical").onchange = e=>{state.filters.vertical=e.target.value; rerender();};
  $("#fImpact").onchange   = e=>{state.filters.impact=e.target.value; rerender();};
  $("#fWindow").onchange   = e=>{state.filters.days=+e.target.value; reloadActive();};
  // search
  let st;
  $("#globalSearch").addEventListener("input", e=>{
    clearTimeout(st); const q=e.target.value.trim();
    st=setTimeout(()=>{ if(q){ switchTab("all-intelligence", q); } }, 350);
  });
  // modal close
  $("#modal").onclick = e=>{ if(e.target.id==="modal") closeModal(); };
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });
  // ECG draw
  const line = $("#ecgline");
  if(line && !matchMedia("(prefers-reduced-motion:reduce)").matches){
    const len = line.getTotalLength();
    line.style.strokeDasharray = len; line.style.strokeDashoffset = len;
    line.animate([{strokeDashoffset:len},{strokeDashoffset:0}],{duration:2000,easing:"ease-out",fill:"forwards"});
  }
  loadStats();
  switchTab("exec-brief");
}

async function loadStats(){
  try{
    const {stats} = await api("/api/stats");
    const cells = document.querySelectorAll("#statsStrip .stat__n");
    cells[0].textContent = fmt(stats.total_clusters);
    cells[1].textContent = fmt(stats.recent_clusters_7d);
    cells[2].textContent = fmt(stats.high_impact_clusters);
    cells[3].textContent = fmt(stats.regulatory_clearances);
    cells[4].textContent = fmt(stats.total_articles);
  }catch(e){ /* stats stay as — */ }
}
const fmt = n => n==null?"—":Intl.NumberFormat("en",{notation:n>9999?"compact":"standard"}).format(n);

/* ============================ TAB SWITCH ============================ */
function switchTab(id, searchQ){
  state.active = id;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", b.id==="tab-"+id));
  const tab = TABS.find(t=>t.id===id);
  $("#viewTitle").textContent = tab.label;
  $("#viewDesc").textContent = tab.desc;
  $("#filters").hidden = (tab.kind==="chat");
  // vertical filter only meaningful on grouped/table
  if(searchQ!==undefined){ state.searchQ = searchQ; $("#globalSearch").value = searchQ; }
  else if(id!=="all-intelligence"){ state.searchQ = ""; }
  reloadActive();
}

function reloadActive(){
  const tab = TABS.find(t=>t.id===state.active);
  if(tab.kind==="chat"){ renderChat(); return; }
  if(tab.kind==="table"){ state.page[tab.id]=0; loadTable(tab,true); return; }
  loadGrouped(tab);
}

function rerender(){ // client-side filter change (vertical/impact) — re-render from cache
  const tab = TABS.find(t=>t.id===state.active);
  if(tab.kind==="grouped" && state.cache[cacheKey(tab)]) renderGrouped(state.cache[cacheKey(tab)]);
  else if(tab.kind==="table"){ state.page[tab.id]=0; loadTable(tab,true); }
  else reloadActive();
}

const cacheKey = tab => `${tab.id}|${state.filters.days}`;

/* ============================ GROUPED (Exec Brief + lens tabs) ============================ */
async function loadGrouped(tab){
  const key = cacheKey(tab);
  if(state.cache[key]){ renderGrouped(state.cache[key]); return; }
  showSkeleton();
  try{
    const days = state.filters.days ? `?days=${state.filters.days}&limit_per_vertical=9` : `?limit_per_vertical=9`;
    const data = await api(tab.path + days);
    state.cache[key] = data;
    renderGrouped(data);
  }catch(e){ showError(); }
}

function renderGrouped(data){
  const c = $("#content"); c.innerHTML="";
  const wrapper = el("div","wrap-center");
  let shown = 0;
  (data.verticals||[]).forEach(group=>{
    // vertical filter
    if(state.filters.vertical && group.vertical!==state.filters.vertical) return;
    let clusters = group.clusters||[];
    if(state.filters.impact) clusters = clusters.filter(c=> (c.impact_level||"")===state.filters.impact);
    if(!clusters.length) return;
    shown += clusters.length;
    const sec = el("section","vsection");
    sec.appendChild(vHead(group.vertical, clusters.length));
    const grid = el("div","vgrid");
    clusters.forEach(cl=>grid.appendChild(card(cl)));
    sec.appendChild(grid);
    wrapper.appendChild(sec);
  });
  if(!shown){ showEmpty(); return; }
  c.appendChild(wrapper);
}

function vHead(name, count){
  const h = el("div","vhead");
  h.innerHTML = `<div class="vhead__icon">${ICONS[name]||ICON_DEFAULT}</div>
    <div class="vhead__name">${esc(name)}</div>
    <div class="vhead__count">${count} ${count===1?"event":"events"}</div>`;
  return h;
}

function card(cl){
  const impact = cl.impact_level||"";
  const accent = ACCENTS[impact]||"var(--electric)";
  const src = cl.primary_source||{};
  const srcUrl = src.url||src.canonical_url;
  const qClass = sourceQualityClass(cl.source_quality);
  const c = el("article","card glass");
  c.style.setProperty("--accent", accent);
  c.innerHTML = `
    <div class="card__top">
      <span class="impact" data-i="${impact.toLowerCase()}">${esc(impact||"—")}</span>
      ${cl.article_count>1?`<span class="csize">${STACK_SVG}${cl.article_count} sources</span>`:``}
    </div>
    <div class="card__title">${esc(cl.cluster_title||"Untitled event")}</div>
    ${cl.why_it_matters?`<div class="card__why">${esc(cl.why_it_matters)}</div>`:``}
    <div class="card__rule"></div>
    <div class="card__sub">${esc(cl.sub_vertical||"")}</div>
    <div class="badges">
      ${cl.evidence_strength?`<span class="badge">Evidence <b>${esc(cl.evidence_strength)}</b></span>`:``}
      ${cl.source_quality?`<span class="badge ${qClass}">${esc(cl.source_quality)}</span>`:``}
    </div>
    <div class="card__foot">
      <span class="src">${srcUrl?`<a href="${esc(srcUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(src.source||"Source")} ${LINK_SVG}</a>`:esc(src.source||"")}</span>
      ${cl.cluster_rank_score!=null?`<span class="rank">rank <b>${cl.cluster_rank_score}</b></span>`:``}
    </div>`;
  c.onclick = ()=>openCluster(cl.id);
  return c;
}

function sourceQualityClass(q){
  q=(q||"").toLowerCase();
  if(q.includes("official")) return "q-official";
  if(q.includes("peer")) return "q-peer";
  if(q.includes("pr")) return "q-pr";
  return "";
}

/* ============================ TABLE (All Intelligence) ============================ */
const PAGE_SIZE = 40;
async function loadTable(tab, reset){
  if(reset) $("#content").innerHTML="";
  const offset = (state.page[tab.id]||0)*PAGE_SIZE;
  if(reset) showSkeleton();
  try{
    const p = new URLSearchParams({limit:PAGE_SIZE, offset});
    if(state.filters.vertical) p.set("vertical", state.filters.vertical);
    if(state.filters.impact) p.set("impact", state.filters.impact);
    if(state.filters.days) p.set("days", state.filters.days);
    if(state.searchQ) p.set("search", state.searchQ);
    const data = await api(tab.path+"?"+p.toString());
    renderTable(data.articles||[], reset);
  }catch(e){ showError(); }
}

function renderTable(rows, reset){
  const c = $("#content");
  if(reset && !rows.length){ showEmpty(state.searchQ?`No results for “${esc(state.searchQ)}”.`:null); return; }
  let table = $("#itbl");
  if(reset || !table){
    c.innerHTML = `<div class="tablewrap glass"><table class="itable" id="itbl">
      <thead><tr><th>Event</th><th>Vertical</th><th>Impact</th><th>Source</th><th>Date</th><th>Rank</th></tr></thead>
      <tbody></tbody></table></div>`;
    table = $("#itbl");
  }
  const tb = table.querySelector("tbody");
  rows.forEach(a=>{
    const url=a.url; const tr=el("tr");
    tr.innerHTML = `
      <td class="t-title">${url?`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(a.title||"")}</a>`:esc(a.title||"")}
        <div class="t-meta">${esc(a.sub_vertical||"")}${a.geography?`<span class="t-dot">·</span>${esc(a.geography)}`:""}</div></td>
      <td>${esc(a.primary_vertical||"")}</td>
      <td><span class="idot" style="background:${ACCENTS[a.impact_level]||'var(--slate)'}"></span>${esc(a.impact_level||"—")}</td>
      <td>${esc(a.source||"")}<div class="t-meta">${esc(a.source_quality||"")}</div></td>
      <td class="t-date">${fmtDate(a.published_date)}</td>
      <td class="t-rank">${a.rank_score!=null?a.rank_score:"—"}</td>`;
    tb.appendChild(tr);
  });
  // load more
  const old=$("#loadmore"); if(old) old.remove();
  if(rows.length===PAGE_SIZE){
    const tab=TABS.find(t=>t.id==="all-intelligence");
    const btn=el("button","loadmore","Load more"); btn.id="loadmore";
    btn.onclick=()=>{ state.page[tab.id]=(state.page[tab.id]||0)+1; btn.textContent="Loading…"; loadTable(tab,false).then(()=>btn.remove()); };
    $(".tablewrap").after(btn);
  }
}
function fmtDate(iso){ if(!iso) return "—"; const d=new Date(iso); return isNaN(d)?"—":d.toLocaleDateString("en",{month:"short",day:"numeric",year:"2-digit"}); }

/* ============================ ASK AI ============================ */
function renderChat(){
  const c=$("#content");
  c.innerHTML = `<div class="ask glass">
    <div class="ask__log" id="askLog"></div>
    <form class="ask__form" id="askForm">
      <input id="askInput" placeholder="Ask about FDA clearances, funding rounds, deployments…" autocomplete="off"/>
      <button class="ask__send" type="submit">Ask</button>
    </form></div>`;
  const log=$("#askLog");
  if(!state.chat.length){
    log.innerHTML = `<div class="ask__hello">
      <h2>Ask the intelligence database</h2>
      <p>Query events across all seven verticals — regulatory clearances, clinical evidence, deals, deployments, and risk. Answers cite their sources.</p>
      <div class="ask__chips">
        <button class="chip">What FDA clearances happened this week?</button>
        <button class="chip">Recent AI drug discovery partnerships</button>
        <button class="chip">Latest ambient documentation deployments</button>
      </div></div>`;
    log.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{ $("#askInput").value=ch.textContent; sendChat(); });
  } else {
    state.chat.forEach(m=>log.appendChild(chatBubble(m)));
    log.scrollTop=log.scrollHeight;
  }
  $("#askForm").onsubmit = e=>{ e.preventDefault(); sendChat(); };
  $("#askInput").focus();
}

function chatBubble(m){
  const d=el("div","msg "+(m.role==="user"?"user":"ai"));
  let srcHtml="";
  if(m.sources&&m.sources.length){
    srcHtml = `<div class="msg__src">`+m.sources.slice(0,6).map(s=>
      `<a href="${esc(s.link||"#")}" target="_blank" rel="noopener"><span class="tag ${s.type==='web'?'web':'db'}">${s.type==='web'?'web':'db'}</span>${esc(s.title||s.link||"")}</a>`
    ).join("")+`</div>`;
  }
  d.innerHTML = `<div class="msg__av">${m.role==="user"?"YOU":"Z"}</div>
    <div class="msg__body">${esc(m.content)}${srcHtml}</div>`;
  return d;
}

async function sendChat(){
  const input=$("#askInput"); const q=input.value.trim(); if(!q) return;
  const hello=$(".ask__hello"); if(hello) hello.remove();
  const log=$("#askLog");
  state.chat.push({role:"user",content:q});
  log.appendChild(chatBubble({role:"user",content:q}));
  input.value=""; input.disabled=true; $(".ask__send").disabled=true;
  const thinking=el("div","msg ai"); thinking.innerHTML=`<div class="msg__av">Z</div><div class="msg__body"><span class="dots"><span></span><span></span><span></span></span></div>`;
  log.appendChild(thinking); log.scrollTop=log.scrollHeight;
  try{
    const r = await fetch(API_BASE+"/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:q, conversation_history:state.chat.slice(0,-1).map(m=>({role:m.role,content:m.content}))})});
    const data = await r.json();
    thinking.remove();
    if(!r.ok) throw new Error(data.detail||"error");
    const msg={role:"assistant",content:data.answer||"No response.",sources:data.sources||[]};
    state.chat.push(msg); log.appendChild(chatBubble(msg));
  }catch(e){
    thinking.remove();
    const msg={role:"assistant",content:"Couldn't reach the assistant. Check that the API is running and GEMINI_API_KEY is configured."};
    state.chat.push(msg); log.appendChild(chatBubble(msg));
  }
  input.disabled=false; $(".ask__send").disabled=false; input.focus(); log.scrollTop=log.scrollHeight;
}

/* ============================ CLUSTER MODAL ============================ */
async function openCluster(id){
  const box=$("#modalBox"); const modal=$("#modal");
  box.innerHTML = `<div style="text-align:center;padding:40px"><div class="spinner"></div></div>`;
  modal.classList.add("open"); document.body.style.overflow="hidden";
  try{
    const {cluster} = await api("/api/clusters/"+id);
    box.innerHTML = clusterDetail(cluster);
    box.querySelector(".modal__close").onclick = closeModal;
  }catch(e){
    box.innerHTML = `<div class="state"><h3>Couldn't load this event</h3><p>The intelligence service didn't respond. Try again.</p></div>`;
  }
}
function clusterDetail(cl){
  const impact=cl.impact_level||""; const arts=cl.articles||[];
  return `<div class="modal__head">
      <div>
        <span class="impact" data-i="${impact.toLowerCase()}" style="display:inline-block;margin-bottom:10px">${esc(impact||"—")}</span>
        <h2>${esc(cl.cluster_title||"Event")}</h2>
      </div>
      <button class="modal__close" aria-label="Close"><svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="card__sub" style="font-size:12.5px">${esc(cl.primary_vertical||"")} <span class="geo" style="color:var(--slate)">· ${esc(cl.sub_vertical||"")}</span></div>
    ${cl.cluster_summary?`<p style="font-size:14px;color:var(--mist);line-height:1.6;margin-top:14px">${esc(cl.cluster_summary)}</p>`:``}
    ${cl.why_it_matters?`<div class="modal__why"><b>Why it matters.</b> ${esc(cl.why_it_matters)}</div>`:``}
    <div class="badges" style="margin-top:14px">
      ${cl.evidence_strength?`<span class="badge">Evidence <b>${esc(cl.evidence_strength)}</b></span>`:``}
      ${cl.source_quality?`<span class="badge ${sourceQualityClass(cl.source_quality)}">${esc(cl.source_quality)}</span>`:``}
      ${cl.cluster_rank_score!=null?`<span class="badge">Rank <b>${cl.cluster_rank_score}</b></span>`:``}
      <span class="badge">${arts.length} ${arts.length===1?"source":"sources"}</span>
    </div>
    <div class="modal__members"><h4>Coverage (${arts.length})</h4>
      ${arts.map(a=>`<div class="member">
        <span class="member__q">${esc((a.source_quality||"·").split(" ")[0])}</span>
        <div class="member__main">
          <div class="member__t">${a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title||"")}</a>`:esc(a.title||"")}${a.primary_source_in_cluster?`<span class="rep-tag">primary</span>`:``}</div>
          <div class="member__m">${esc(a.source||"")} · ${fmtDate(a.published_date)} · ${esc(a.relationship_type||"")}</div>
        </div></div>`).join("")}
    </div>`;
}
function closeModal(){ $("#modal").classList.remove("open"); document.body.style.overflow=""; }

/* ============================ STATES ============================ */
function showSkeleton(){
  $("#content").innerHTML = `<div class="skeleton"><div class="sk-grid">${'<div class="sk-card"></div>'.repeat(6)}</div></div>`;
}
function showEmpty(msg){
  $("#content").innerHTML = `<div class="state glass">
    <h3>Nothing here yet</h3>
    <p>${msg||"No events match this view. Run the pipeline to populate intelligence, or widen the time window."}</p>
    ${!msg?`<div class="mono">python run_pipeline.py</div>`:``}
  </div>`;
}
function showError(){
  $("#content").innerHTML = `<div class="state glass">
    <h3>Couldn't reach the intelligence service</h3>
    <p>The API didn't respond. Check that the backend is running and that the API address is set correctly.</p>
    <div class="mono">API_BASE = "${API_BASE||"(same origin)"}"</div>
  </div>`;
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
